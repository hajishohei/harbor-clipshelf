<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'" />
  <title>ClipShelf</title>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <div class="panel" id="panel" role="dialog" aria-label="クリップボード">
    <div class="resize" id="resize" title="ドラッグで高さを変更（ダブルクリックで元に戻す）"></div>
    <header class="toolbar">
      <div class="search" id="searchBox">
        <span class="search-icon" id="searchIcon"></span>
        <div class="tokens" id="tokens"></div>
        <input id="search" type="text" placeholder="検索" autocomplete="off" spellcheck="false" aria-label="検索" />
        <button class="icon-btn" id="clearSearch" title="検索をクリア" hidden></button>
      </div>
      <nav class="boards" id="boards" role="tablist" aria-label="ピンボード"></nav>
      <div class="tools">
        <span class="paused" id="paused" hidden></span>
        <button class="icon-btn" id="filterBtn" title="フィルタ（⌘F を2回）"></button>
        <button class="icon-btn" id="moreBtn" title="メニュー"></button>
      </div>
    </header>
    <div class="filters" id="filters" hidden></div>
    <main class="cards" id="cards" tabindex="-1" aria-label="アイテム"></main>
    <div class="empty" id="empty" hidden></div>
  </div>
  <script src="../shared/accelerator.js"></script>
  <script src="common.js"></script>
  <script src="panel.js"></script>
</body>
</html>
