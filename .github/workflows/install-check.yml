# 社員向けの1行インストーラ（scripts/install-mac.sh / install-windows.ps1）を、
# 公開中の最新リリースに対して実際の macOS / Windows で動かして確認します。
# インストーラを変更したとき・手動実行（Actions → install-check → Run workflow）で動きます。
name: install-check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/install-mac.sh', 'scripts/install-windows.ps1']

permissions:
  contents: read

jobs:
  mac-install:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the installer the same way staff do (curl | bash)
        run: cat scripts/install-mac.sh | bash
      - name: Check the installed app
        run: |
          set -e
          APP="/Applications/HarboR ClipShelf.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$APP"
          if xattr -p com.apple.quarantine "$APP" >/dev/null 2>&1; then echo "::error::quarantine flag is set"; exit 1; fi
          sleep 5
          pgrep -fl "/HarboR ClipShelf.app/Contents/MacOS/" || { echo "::error::app did not start"; exit 1; }
      - name: Re-run (update in place while running)
        run: cat scripts/install-mac.sh | bash
      - name: Quit
        if: always()
        run: pkill -f "/HarboR ClipShelf.app/Contents/MacOS/" || true

  windows-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the installer the same way staff do (irm | iex, Windows PowerShell 5.1)
        shell: powershell
        run: Get-Content scripts/install-windows.ps1 -Raw -Encoding UTF8 | Invoke-Expression
      - name: Check the installed app
        shell: powershell
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\HarboR ClipShelf\HarboR ClipShelf.exe'
          if (-not (Test-Path $exe)) { throw "not installed at $exe" }
          (Get-Item $exe).VersionInfo | Format-List ProductVersion, FileVersion
          $zone = Get-Item $exe -Stream Zone.Identifier -ErrorAction SilentlyContinue
          if ($zone) { throw 'Mark-of-the-Web is set (SmartScreen would warn)' }
          Start-Sleep -Seconds 8
          if (-not (Get-Process -Name 'HarboR ClipShelf' -ErrorAction SilentlyContinue)) { throw 'app did not start' }
          Get-Process -Name 'HarboR ClipShelf' | Select-Object -First 3 Id, Path | Format-Table
      - name: Re-run while the app is running (update in place)
        shell: powershell
        run: |
          Get-Content scripts/install-windows.ps1 -Raw -Encoding UTF8 | Invoke-Expression
          Start-Sleep -Seconds 8
          if (-not (Get-Process -Name 'HarboR ClipShelf' -ErrorAction SilentlyContinue)) { throw 'app did not start again' }
      - name: PowerShell 7 can run it too (download + checksum only)
        shell: pwsh
        run: |
          $env:CLIPSHELF_DRYRUN = '1'
          Get-Content scripts/install-windows.ps1 -Raw | Invoke-Expression
      - name: Quit
        if: always()
        shell: powershell
        run: Get-Process -Name 'HarboR ClipShelf' -ErrorAction SilentlyContinue | Stop-Process -Force
