# Mac の「毎回同じ証明書で署名する」仕組み（scripts/after-sign.js）を、
# 使い捨ての証明書で試すワークフロー。本物の証明書（secret）は使いません。
name: sign-check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/after-sign.js', 'scripts/make-signing-cert.sh', 'src/main/platform/mac-appicon.jxa.js', '.github/workflows/sign-check.yml']

jobs:
  mac-sign:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Make a throwaway certificate
        shell: bash
        run: |
          bash scripts/make-signing-cert.sh /tmp/testcert
          echo "MAC_SIGNING_CERT=$(cat /tmp/testcert/MAC_SIGNING_CERT.txt)" >> "$GITHUB_ENV"
      - name: Build (unpacked) with the certificate
        run: npx electron-builder --mac --arm64 --dir --publish never
      - name: Check the signature and launch
        shell: bash
        run: |
          set -e
          APP="$(ls -d release/mac-arm64/*.app | head -1)"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d -r- "$APP" 2>&1 | tee /tmp/dr1.txt
          grep -q 'certificate' /tmp/dr1.txt
          if grep -q 'cdhash' /tmp/dr1.txt; then echo "still ad-hoc"; exit 1; fi
          # a second build must have the very same requirement (= macOS keeps permissions)
          rm -rf release
          npx electron-builder --mac --arm64 --dir --publish never
          APP="$(ls -d release/mac-arm64/*.app | head -1)"
          codesign -d -r- "$APP" 2>&1 | grep designated > /tmp/dr2.txt
          grep designated /tmp/dr1.txt > /tmp/dr1d.txt
          diff /tmp/dr1d.txt /tmp/dr2.txt
          open "$APP"
          sleep 12
          pgrep -f "$APP/Contents/MacOS/" > /dev/null
          /usr/bin/afplay -v 0 /System/Library/Sounds/Pop.aiff
          ls /System/Library/Sounds
          osascript -e "tell application \"$APP\" to quit" || pkill -f "$APP/Contents/MacOS/" || true
          echo "OK: signed with a stable certificate and launches"
      - name: Real app icons (separate helper, must finish quickly)
        shell: bash
        timeout-minutes: 2
        run: |
          set -e
          for app in /System/Applications/Calculator.app "/Applications/Google Chrome.app" /System/Library/CoreServices/Finder.app; do
            [ -e "$app" ] || continue
            start=$(date +%s)
            perl -e 'alarm shift; exec @ARGV' 20 osascript -l JavaScript -e "$(cat src/main/platform/mac-appicon.jxa.js)" "$app" 64 > /tmp/icon.txt
            node -e '
              const b64 = require("fs").readFileSync("/tmp/icon.txt", "utf8").trim();
              const png = Buffer.from(b64, "base64");
              if (png.slice(1, 4).toString() !== "PNG") { console.error("not a PNG:", b64.slice(0, 80)); process.exit(1); }
              console.log("icon OK:", process.argv[1], png.length, "bytes");
            ' "$app"
            echo "took $(( $(date +%s) - start ))s"
          done
          # the shared paste/window helper still answers
          printf '%s\n' '{"id":1,"cmd":"ping"}' | perl -e 'alarm shift; exec @ARGV' 20 osascript -l JavaScript -e "$(cat src/main/platform/mac-commands.jxa.js)" | tee /tmp/ping.txt
          grep -q pong /tmp/ping.txt
